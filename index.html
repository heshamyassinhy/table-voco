    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .color-pink { border-color: #f472b6 !important; background-color: #fdf2f8; }
        .color-black { border-color: #1e293b !important; background-color: #f8fafc; }
        .color-blue { border-color: #3b82f6 !important; background-color: #eff6ff; }
        .color-green { border-color: #22c55e !important; background-color: #f0fdf4; }
        .color-white { border-color: #e2e8f0 !important; background-color: #ffffff; }

        .table-circle { 
            width: 140px; height: 140px; 
            border-radius: 50%; 
            border: 8px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            position: relative; transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        
        .seat { 
            width: 38px; height: 38px; 
            border-radius: 50%; 
            background: #ffffff; 
            border: 2px solid #cbd5e1; 
            position: absolute; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            z-index: 20; font-size: 10px;
        }
        .seat.attended { background: #22c55e; border-color: #16a34a; color: white; }

        .seat::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            white-space: pre; 
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            width: 140px;
            line-height: 1.4;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .seat:hover::after { opacity: 1; }

        .seat-focus {
            animation: seat-glow 0.8s infinite alternate;
            z-index: 50;
            border-color: #f59e0b !important;
            box-shadow: 0 0 15px #f59e0b;
        }
        @keyframes seat-glow {
            from { transform: translate(var(--x), var(--y)) scale(1); }
            to { transform: translate(var(--x), var(--y)) scale(1.3); }
        }

        .highlight-table { animation: highlight-pulse 1.5s infinite; }
        @keyframes highlight-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .gift-img { width: 60px; height: 60px; object-fit: contain; }
    </style>

        function renderGrid() {
            const grid = document.getElementById('tablesGrid');
            grid.innerHTML = tables.map((table) => {
                let colorClass = getTableColorClass(table.id);
                return `
                    <div id="card-${table.id}" class="flex flex-col items-center p-4 bg-white rounded-3xl border border-slate-100 hover:shadow-lg transition-all cursor-pointer group" onclick="showTableModal(${table.id}, event)">
                        <div class="table-circle ${colorClass}">
                            <span class="text-2xl font-bold text-slate-400 group-hover:text-slate-600 transition-colors">${table.id}</span>
                            ${renderSeats(table)}
                        </div>
                        <div class="mt-3 text-center">
                            <h3 class="font-bold text-xs text-slate-600 truncate w-32">${table.name}</h3>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSeats(table) {
            return table.members.map((m, i) => {
                const angle = (360 / table.members.length) * i;
                const x = Math.cos(angle * Math.PI / 180) * 70;
                const y = Math.sin(angle * Math.PI / 180) * 70;
                const seatId = `seat-${m.name.replace(/\s+/g, '-')}`;
                const tooltip = `${m.name}\n(${m.title || 'موظف'})`;
                
                return `
                    <div id="${seatId}" class="seat ${attendance[m.name] ? 'attended' : ''}" 
                         data-tooltip="${tooltip}"
                         onclick="event.stopPropagation(); handleToggle('${m.name}')"
                         style="transform: translate(${x}px, ${y}px); --x: ${x}px; --y: ${y}px;">
                        ${attendance[m.name] ? '✓' : ''}
                    </div>
                `;
            }).join('');
        }

                                <thead>
                                    <tr class="text-slate-400 border-b">
                                        <th class="p-3">الاسم والبيانات</th>
                                        <th class="p-3 text-left">الإجراء</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${table.members.map(m => `
                                        <tr class="border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                                            <td class="p-3">
                                                <div class="flex items-center gap-2">
                                                    <span class="font-bold text-slate-700">${m.name}</span>
                                                    ${attendance[m.name] ? '<span class="text-[10px] font-bold text-green-500 bg-green-50 px-2 py-0.5 rounded border border-green-200">تم الحضور</span>' : ''}
                                                </div>
                                                <div class="text-[10px] text-slate-400 italic">${m.title || 'موظف'}</div>
                                            </td>
                                            <td class="p-3 text-left">
                                                <button onclick="handleToggle('${m.name}')" 
                                                        class="px-3 py-1.5 rounded-lg font-bold transition-all ${attendance[m.name] ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-blue-600'}">
                                                    ${attendance[m.name] ? 'إلغاء' : 'تحضير'}
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                    ${table.members.length === 0 ? '<tr><td colspan="2" class="p-4 text-center text-slate-300 italic text-[11px]">طاولة فارغة</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // تم تعديل الوظيفة لإزالة نافذة الهدايا والتحضير مباشرة
        function handleToggle(name) {
            attendance[name] = !attendance[name];
            renderUI();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsDiv = document.getElementById('searchResults');
            if (!query) { resultsDiv.classList.add('hidden'); return; }

            const allStaff = tables.flatMap(t => t.members.map(m => ({...m, tableId: t.id})));
            const filtered = allStaff.filter(s => s.name.toLowerCase().includes(query));

            if (filtered.length > 0) {
                resultsDiv.innerHTML = filtered.map(s => `
                    <div onclick="focusUser('${s.name}', ${s.tableId})" class="p-4 hover:bg-slate-50 cursor-pointer flex justify-between items-center border-b last:border-0 transition-colors">
                        <div class="text-right">
                            <div class="font-bold text-slate-700 text-sm">${s.name}</div>
                            <div class="text-[10px] text-slate-400">(${s.title})</div>
                        </div>
                        <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-md font-bold">طاولة ${s.tableId}</span>
                    </div>
                `).join('');
                resultsDiv.classList.remove('hidden');
            } else { resultsDiv.classList.add('hidden'); }
        }

        function focusUser(userName, tableId) {
            document.getElementById('searchResults').classList.add('hidden');
            const card = document.getElementById(`card-${tableId}`);
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('highlight-table');
            
            const seatId = `seat-${userName.replace(/\s+/g, '-')}`;
            const seat = document.getElementById(seatId);
            if (seat) seat.classList.add('seat-focus');

            setTimeout(() => {
                card.classList.remove('highlight-table');
                if (seat) seat.classList.remove('seat-focus');
            }, 3000);
        }

        function showTableModal(tableId, event) {
            if (event && (event.target.classList.contains('seat') || event.target.tagName === 'BUTTON')) return;

            const table = tables.find(t => t.id === tableId);
            const content = table.members.map(m => `
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl mb-2 text-right border border-transparent hover:border-blue-100 transition-all">
                    <div>
                        <div class="text-sm font-bold text-slate-700">${m.name}</div>
                        <div class="text-[10px] text-slate-400 font-medium italic">(${m.title || 'موظف'})</div>
                        ${attendance[m.name] ? '<div class="text-[9px] text-green-500 font-bold mt-1">تم الحضور ✓</div>' : ''}
                    </div>
                    <button onclick="Swal.close(); handleToggle('${m.name}')" 
                            class="w-10 h-10 rounded-full flex items-center justify-center transition-all ${attendance[m.name] ? 'bg-green-500 text-white shadow-md' : 'bg-white border-2 text-slate-300 hover:text-blue-500 hover:border-blue-500'}">
                        ${attendance[m.name] ? '✓' : '+'}
                    </button>
                </div>
            `).join('');
            Swal.fire({
                title: `طاولة رقم ${table.id}`,
                html: `<div class="mt-2 h-72 overflow-y-auto px-1 text-right">${content || '<p class="text-slate-300 py-10 text-center">طاولة فارغة</p>'}</div>`,
                showConfirmButton: false,
                showCloseButton: true,
                customClass: { popup: 'rounded-[2rem]' }
            });
        }

        function exportToExcel() {
            const detailData = [];
            let totalAttended = 0;
            let totalStaff = 0;

            tables.forEach(table => {
                table.members.forEach(m => {
                    const isAttended = attendance[m.name] || false;
                    detailData.push({
                        'اسم الموظف': m.name,
                        'المسمى الوظيفي': m.title || 'موظف',
                        'رقم الطاولة': table.id,
                        'اسم الطاولة': table.name,
                        'حالة الحضور': isAttended ? 'حضر' : 'لم يحضر'
                    });
                    totalStaff++;
                    if (isAttended) totalAttended++;
                });
            });

            const summaryData = tables.map(table => {
                const attendedCount = table.members.filter(m => attendance[m.name]).length;
                return {
                    'رقم الطاولة': table.id,
                    'اسم الطاولة': table.name,
                    'عدد الموظفين': table.members.length,
                    'عدد الحضور': attendedCount,
                    'عدد الغياب': table.members.length - attendedCount,
                    'نسبة الحضور': table.members.length > 0 ? ((attendedCount / table.members.length) * 100).toFixed(1) + '%' : '0%'
                };
            });

            summaryData.push({
                'رقم الطاولة': 'الإجمالي العام',
                'اسم الطاولة': '-',
                'عدد الموظفين': totalStaff,
                'عدد الحضور': totalAttended,
                'عدد الغياب': totalStaff - totalAttended,
                'نسبة الحضور': totalStaff > 0 ? ((totalAttended / totalStaff) * 100).toFixed(1) + '%' : '0%'
            });

            const wb = XLSX.utils.book_new();
            const wsDetail = XLSX.utils.json_to_sheet(detailData);
            XLSX.utils.book_append_sheet(wb, wsDetail, "كشف الحضور التفصيلي");
            const wsSummary = XLSX.utils.json_to_sheet(summaryData);
            XLSX.utils.book_append_sheet(wb, wsSummary, "ملخص الحضور");

            const dateStr = new Date().toLocaleDateString('ar-SA').replace(/\//g, '-');
            XLSX.writeFile(wb, `تقرير_حضور_الفعالية_${dateStr}.xlsx`);
            
            Swal.fire({
                icon: 'success',
                title: 'تم التصدير بنجاح',
                text: 'تم تحميل ملف التقرير على جهازك',
                confirmButtonColor: '#22c55e'
            });
        }

        window.onload = () => {
            createTables();
            renderUI();
        };
    </script>
</body>
</html>
